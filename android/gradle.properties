# Batas memori JVM Gradle. GitHub Actions runner gratis punya RAM terbatas (~7GB
# dipakai bersama OS+runner), build sempat gagal dengan "JVM garbage collector is
# thrashing" sebelum ada batas eksplisit di sini.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# Non-aktifkan daemon di CI: setiap run adalah proses sekali-jalan, daemon cuma
# menambah pemakaian memori tanpa manfaat (tidak ada build kedua yang memanfaatkannya).
org.gradle.daemon=false

# AndroidX wajib untuk seluruh dependency di project ini (androidx.*).
android.useAndroidX=true

# Build hanya satu modul (:app), paralelisme antar-modul tidak relevan di sini
# dan hanya menambah overhead memori.
org.gradle.parallel=false
